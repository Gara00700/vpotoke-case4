# Схемы событий ситуационного центра — кейс 4
# Не REST API, а JSON-схемы входа (от датчиков и приложения)
# Проверить на https://www.jsonschemavalidator.net/

$schema: "https://json-schema.org/draft/2020-12/schema"
title: SituationCenterEvents
description: Набор схем событий для ситуационного центра

definitions:

  # ОБРАЗЕЦ — не трогать
  TelemetryEvent:
    type: object
    required: [event_id, time, location, indicator, value]
    additionalProperties: false
    properties:
      event_id:
        type: string
        pattern: '^evt_[A-Za-z0-9]{6,32}$'
      time:
        type: string
        format: date-time
      location:
        type: string
        pattern: '^site_[0-9]{2}$'
      indicator:
        enum: [temperature, humidity, ventilation]
      value:
        type: number
      signature:
        type: string
        description: HMAC-SHA256 подпись события (защита от подмены)

  # Инцидент из мобильного приложения (source=mobile) или созданный системой (source=auto)
  IncidentEvent:
    type: object
    required: [incident_id, type, location, time, status]
    additionalProperties: false
    properties:
      incident_id:
        type: string
        pattern: '^inc_(a[0-9]{2}|[0-9]{3})$'   # inc_001 — из приложения, inc_a01 — автоинцидент
      type:
        enum: [temperature, ventilation, humidity, equipment, other]
      location:
        type: string
        pattern: '^site_[0-9]{2}$'               # плюс проверка по sites.csv -> UNKNOWN_LOCATION
      time:
        type: string
        format: date-time
      responsible:
        type: [string, "null"]                   # employee_id, появляется при ASSIGNED
        pattern: '^[a-z]_[0-9]{3}$'
      status:
        enum: [NEW, ASSIGNED, IN_PROGRESS, CLOSED]
      deadline:
        type: string
        format: date-time                        # по SLA: CRITICAL +1 ч, WARNING +4 ч
      source:
        enum: [mobile, sensor, auto]

  # Алерт — результат срабатывания правила A-1…A-5 (строка alerts_out.csv)
  AlertEvent:
    type: object
    required: [alert_id, severity, at]
    additionalProperties: false
    properties:
      alert_id:
        type: string
        pattern: '^alrt_[0-9]{4}$'
      measurement_id:
        type: string
        description: FK -> Measurement; в прототипе показание задаётся полями location, indicator, value
      location:
        type: string
        pattern: '^site_[0-9]{2}$'
      indicator:
        enum: [temperature, humidity, ventilation]
      value:
        type: [number, "null"]                   # null для STALE
      severity:
        enum: [WARNING, CRITICAL, STALE]
      action:
        enum: [ALERT_CREATED, ESCALATED, DUPLICATE]
      at:
        type: string
        format: date-time

  # Запрос на смену статуса инцидента (строка transitions.csv прототипа)
  TransitionRequest:
    type: object
    required: [incident_id, to, actor]
    additionalProperties: false
    properties:
      incident_id:
        type: string
        pattern: '^inc_(a[0-9]{2}|[0-9]{3})$'
      to:
        enum: [ASSIGNED, IN_PROGRESS, CLOSED]
      actor:
        type: string                             # user_id; роль берётся из учётной записи
        pattern: '^[a-z]_[0-9]{3}$'
      responsible:
        type: [string, "null"]                   # обязателен при to=ASSIGNED, инженер этого участка
      resolution_reason:
        enum: [DONE, NO_ACTION, null]            # NO_ACTION — единственный путь ASSIGNED -> CLOSED
      comment:
        type: [string, "null"]
        maxLength: 500

  # Ответ об ошибке
  Error:
    type: object
    required: [error_code, message]
    additionalProperties: false
    properties:
      error_code:
        enum: [VALIDATION_ERROR, UNKNOWN_LOCATION, INVALID_TRANSITION, DUPLICATE_EVENT, SENSOR_SIGNATURE_INVALID, FORBIDDEN, OUT_OF_ZONE]
      message:
        type: string
      retryable:
        type: boolean                            # true только для временных сбоев; ошибки данных повторять нельзя
      details:
        type: object
        properties:
          field:
            type: string                         # например location
          code:
            type: string                         # например UNKNOWN_LOCATION

examples:

  valid_telemetry:
    event_id: evt_ab12cd
    time: "2025-11-01T08:00:00Z"
    location: site_01
    indicator: temperature
    value: 28.3
    signature: "hmac:..."

  valid_incident:
    incident_id: inc_001
    type: temperature
    location: site_01
    time: "2025-11-01T08:00:00Z"
    responsible: null
    status: NEW
    source: sensor

  invalid_location:
    incident_id: inc_999
    type: temperature
    location: site_99       # не из sites.csv
    time: "2025-11-01T08:00:00Z"
    status: NEW

  invalid_transition:
    incident_id: inc_001
    to: CLOSED               # напрямую из NEW нельзя
    actor: e_101

  invalid_location_error:
    error_code: UNKNOWN_LOCATION
    message: "422 VALIDATION_ERROR: участок не найден в sites.csv"
    retryable: false
    details:
      field: location
      code: UNKNOWN_LOCATION

  out_of_zone_assign:
    incident_id: inc_a01
    to: ASSIGNED
    actor: d_001
    responsible: e_104     # отвечает за site_03, а инцидент на site_02 -> OUT_OF_ZONE
